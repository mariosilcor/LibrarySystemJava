<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Libro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1>Edit</h1>
    <h4>Libro</h4>
    <hr />

    <!-- Mensaje de error capturado por el bloque catch en el Controlador -->
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

    <div class="row">
        <div class="col-md-4">
            <form th:action="@{/libros/edit/{id}(id=${libro.id})}" th:object="${libro}" method="post">

                <!-- Campo oculto para mantener el ID al guardar -->
                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label class="form-label">Título</label>
                    <input type="text" th:field="*{titulo}" class="form-control" />
                    <span th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}" class="text-danger"></span>
                </div>

                <div class="mb-3">
                    <label class="form-label">Autor</label>
                    <input type="text" th:field="*{autor}" class="form-control" />
                    <span th:if="${#fields.hasErrors('autor')}" th:errors="*{autor}" class="text-danger"></span>
                </div>

                <div class="mb-3">
                    <label class="form-label">Año de Publicación</label>
                    <input type="number" th:field="*{añoPublicacion}" class="form-control" />
                    <span th:if="${#fields.hasErrors('añoPublicacion')}" th:errors="*{añoPublicacion}" class="text-danger"></span>
                </div>

                <div class="mb-3">
                    <input type="submit" value="Save" class="btn btn-primary" />
                </div>
            </form>
        </div>
    </div>
    <div>
        <a th:href="@{/libros}">Back to List</a>
    </div>
</div>
</body>
</html>
