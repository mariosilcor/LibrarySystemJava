<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear Libro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1>Create</h1>
    <h4>Libro</h4>
    <hr />
    <div class="row">
        <div class="col-md-4">
            <!-- Equivalente a Html.BeginForm -->
            <form th:action="@{/libros/create}" th:object="${libro}" method="post">

                <div class="mb-3">
                    <label class="form-label">Título</label>
                    <input type="text" th:field="*{titulo}" class="form-control" />
                    <!-- Equivalente a Html.ValidationMessageFor -->
                    <span th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}" class="text-danger"></span>
                </div>

                <div class="mb-3">
                    <label class="form-label">Autor</label>
                    <input type="text" th:field="*{autor}" class="form-control" />
                    <span th:if="${#fields.hasErrors('autor')}" th:errors="*{autor}" class="text-danger"></span>
                </div>

                <div class="mb-3">
                    <label class="form-label">Año de Publicación</label>
                    <input type="number" th:field="*{añoPublicacion}" class="form-control" />
                    <span th:if="${#fields.hasErrors('añoPublicacion')}" th:errors="*{añoPublicacion}" class="text-danger"></span>
                </div>

                <div class="mb-3">
                    <input type="submit" value="Create" class="btn btn-primary" />
                </div>
            </form>
        </div>
    </div>
    <div>
        <a th:href="@{/libros}">Back to List</a>
    </div>
</div>
</body>
</html>
