# CONFIGURACIÓN DE LA BASE DE DATOS H2 (En memoria, equivalente a LocalDB)

# URL de conexión: Guarda los datos en un archivo local llamado "bibliotecaDB"
spring.datasource.url=jdbc:h2:file:./bibliotecaDB;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

# Credenciales por defecto de H2
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate (El motor de Entity Framework para Java)
# "update" creará automáticamente la tabla Libros basada en nuestra clase (Code First)
spring.jpa.hibernate.ddl-auto=update

# Habilitar la consola web de H2 para ver nuestra base de datos en el navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console